<!DOCTYPE html><html lang="es">
<head>
 <meta charset="UTF-8">
 <title>Recursos</title>

 <style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: white;
    min-height: 100vh;
    padding: 40px;
}

h1{
    color: #38bdf8;
    margin-bottom: 20px;
    font-size: 40px;
}

p{
    margin-bottom: 15px;
    line-height: 1.6;
    font-size: 18px;
}

a{
    display: inline-block;
    text-decoration: none;
    background: #38bdf8;
    color: black;
    padding: 10px 18px;
    border-radius: 10px;
    margin-right: 10px;
    margin-top: 15px;
    font-weight: bold;
    transition: 0.3s;
}

a:hover{
    background: white;
    transform: scale(1.05);
}

ul{
    margin-top: 20px;
    padding-left: 20px;
}

li{
    margin-bottom: 10px;
    font-size: 18px;
}

</style>
</head>
<body>
<h1>Recursos de clase</h1>

<h1>Angie Valentina Alape Cubillos</h1>

 <ul> {% for recurso in recursos %}<li>{{ recurso }}</li>{% endfor %} </ul>
 <hr>
 <a href="/">Inicio</a>
 <a href="/acerca">Acerca</a>
 <a href="/contacto">Contacto</a>
 
</body></html>
